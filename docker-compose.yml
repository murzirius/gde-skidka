version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    restart: always
    environment:
      POSTGRES_USER: gde_skidka
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: gde_skidka
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 350M # Жесткий лимит памяти для PostgreSQL, чтобы влезть в 1GB

  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://gde_skidka:secure_password@db:5432/gde_skidka
      - S3_BUCKET=your_yandex_bucket
      - S3_ACCESS_KEY=your_key
      - S3_SECRET_KEY=your_secret
    ports:
      - "8000:8000"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 400M # Лимит для FastAPI

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  db_data:
